<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Programas académicos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container"><a class="navbar-brand" href="{% url 'crear_programa' %}">Gestión de programas</a></div>
    </nav>
    <main class="container pb-5">
        {% if messages %}
            {% for message in messages %}<div class="alert alert-success" role="status">{{ message }}</div>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
